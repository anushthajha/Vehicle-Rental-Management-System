services:
  - type: web
    name: vehicle-rental-management-system-vms
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # ── Databases (set secret values in Render dashboard, not here) ──────────
      - key: MYSQL_URL
        sync: false          # paste Aiven Service URI in Render dashboard
      - key: MONGODB_URL
        sync: false          # paste Atlas SRV URI in Render dashboard
      - key: MONGODB_DB_NAME
        value: sigfleet_docs

      # ── Redis (none on free tier — leave blank) ───────────────────────────────
      - key: REDIS_URL
        value: ""

      # ── Auth ──────────────────────────────────────────────────────────────────
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates a secure random value
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"

      # ── Cookies (cross-domain: Vercel frontend + Render backend) ─────────────
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none

      # ── Frontend / CORS ───────────────────────────────────────────────────────
      - key: FRONTEND_URL
        sync: false          # set after Vercel gives you the URL
      - key: CORS_ORIGINS
        value: ""

      # ── Email ─────────────────────────────────────────────────────────────────
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_NAME
        value: SigFleet
      - key: SMTP_USE_TLS
        value: "true"

      # ── AI Keys ───────────────────────────────────────────────────────────────
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

      # ── App ───────────────────────────────────────────────────────────────────
      - key: SKIP_DB_WAIT
        value: "true"
      - key: RUN_SEED
        value: "false"
      - key: UPLOAD_DIR
        value: uploads
