<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zoomcar Clone</title>
    <style>
      :root {
        color: #111827;
        background: #f9fafb;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      section {
        width: min(720px, 100%);
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        background: #fff;
        padding: 40px;
        box-shadow: 0 18px 40px rgb(17 24 39 / 8%);
      }
      .eyebrow {
        color: #e31837;
        font-size: 14px;
        font-weight: 700;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(40px, 8vw, 64px);
        line-height: 1;
      }
      p {
        color: #4b5563;
        font-size: 18px;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        background: #e31837;
        color: white;
        padding: 0 18px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <p class="eyebrow">Phase 1 scaffold</p>
        <h1>Zoomcar Clone</h1>
        <p>Docker, FastAPI, MySQL, MongoDB, Redis, Celery, and Nginx are wired and ready for the next implementation phase.</p>
        <a href="/api/docs">Open API Docs</a>
      </section>
    </main>
  </body>
</html>
